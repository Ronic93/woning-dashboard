name: refresh-aanbod
on:
  schedule: [{cron: "30 6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 refresh.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/listings.json && git commit -m "aanbod refresh" || true
          git push
